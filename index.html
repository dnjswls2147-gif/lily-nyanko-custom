<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>릴리 냥코 커스텀</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171923;color:white;font-family:Arial,sans-serif}
header{padding:22px 12px;text-align:center;background:#252638}
h1{color:#b9a0ff;font-size:27px}
main{max-width:600px;margin:auto;padding:18px}
.panel{background:#262939;padding:20px;border-radius:18px;margin:15px 0}
input,select{width:100%;padding:14px;border-radius:10px;border:1px solid #6556a5;background:#151722;color:white;font-size:16px;margin:8px 0}
button{border:0;border-radius:10px;background:#8b6bff;color:white;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{width:100%;margin-top:12px}
.hidden{display:none}
.small{color:#c5c7d5;font-size:14px;line-height:1.6}
.stat{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat input{max-width:150px}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.item{padding:14px;background:#1b1e2b;border-radius:12px;margin:10px 0}
label{display:block;padding:8px 0}
</style>
</head>
<body>
<header>
  <h1>🐱 릴리 냥코 커스텀</h1>
  <div>나만의 냥코 커스텀 공간</div>
</header>

<main>
  <section id="login" class="panel">
    <h2>🔑 나의 냥코 코드 입력</h2>
    <p class="small">
      나의 커스텀 코드를 입력하고 적용하기를 눌러 줘!
      이 사이트에서 사용하는 코드 입력 기능이야.
    </p>
    <input id="myCode" placeholder="나의 냥코 코드 입력">
    <button class="primary" id="apply">✅ 코드 적용하기</button>
    <p id="message" class="small"></p>
  </section>

  <section id="custom" class="hidden">
    <div class="panel">
      <h2>🐱 나의 냥코 커스텀</h2>
      <p class="small">코드가 입력된 커스텀 화면이야.</p>
      <button id="back">⬅ 코드 입력 화면</button>
    </div>

    <div class="panel">
      <h2>🥫 통조림</h2>
      <div class="stat">
        <span>통조림 수</span>
        <input id="cans" type="number" min="0" value="0">
      </div>
      <div class="actions">
        <button onclick="change('cans',100)">+100</button>
        <button onclick="change('cans',-100)">-100</button>
      </div>
    </div>

    <div class="panel">
      <h2>⭐ 경험치</h2>
      <div class="stat">
        <span>경험치</span>
        <input id="xp" type="number" min="0" value="0">
      </div>
      <div class="actions">
        <button onclick="change('xp',1000)">+1000</button>
        <button onclick="change('xp',-1000)">-1000</button>
      </div>
    </div>

    <div class="panel">
      <h2>🗺️ 스테이지</h2>
      <label for="stage">스테이지 선택</label>
      <select id="stage">
        <option>한국편 1장</option>
        <option>한국편 2장</option>
        <option>한국편 3장</option>
        <option>미래편 1장</option>
        <option>미래편 2장</option>
        <option>미래편 3장</option>
        <option>우주편 1장</option>
        <option>레전드 스테이지</option>
      </select>
      <p class="small" id="stageResult">선택한 스테이지: 한국편 1장</p>
    </div>

    <div class="panel">
      <h2>💎 보물</h2>
      <p class="small">커스텀 설정에서 보유한 보물을 선택해 줘.</p>
      <label><input class="treasure" type="checkbox" value="공격력 보물"> 공격력 보물</label>
      <label><input class="treasure" type="checkbox" value="체력 보물"> 체력 보물</label>
      <label><input class="treasure" type="checkbox" value="경험치 보물"> 경험치 보물</label>
      <label><input class="treasure" type="checkbox" value="통조림 보물"> 통조림 보물</label>
    </div>

    <div class="panel">
      <h2>💾 커스텀 설정</h2>
      <button class="primary" id="save">설정 저장하기</button>
      <button class="primary" id="load">저장된 설정 불러오기</button>
      <p id="saveMessage" class="small"></p>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

$('apply').addEventListener('click', () => {
  const code = $('myCode').value.trim();
  if (!code) {
    $('message').textContent = '먼저 나의 냥코 코드를 입력해 줘!';
    return;
  }
  sessionStorage.setItem('lilyCustomCode', code);
  $('login').classList.add('hidden');
  $('custom').classList.remove('hidden');
  window.scrollTo(0, 0);
});

$('back').addEventListener('click', () => {
  $('custom').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('myCode').value = sessionStorage.getItem('lilyCustomCode') || '';
  window.scrollTo(0, 0);
});

function change(id, amount) {
  const el = $(id);
  el.value = Math.max(0, (Number(el.value) || 0) + amount);
}

$('stage').addEventListener('change', () => {
  $('stageResult').textContent =
    '선택한 스테이지: ' + $('stage').value;
});

function getSettings() {
  return {
    cans: Math.max(0, Number($('cans').value) || 0),
    xp: Math.max(0, Number($('xp').value) || 0),
    stage: $('stage').value,
    treasures: [...document.querySelectorAll('.treasure:checked')]
      .map(el => el.value)
  };
}

function setSettings(data) {
  $('cans').value = data.cans ?? 0;
  $('xp').value = data.xp ?? 0;
  $('stage').value = data.stage || '한국편 1장';
  document.querySelectorAll('.treasure').forEach(el => {
    el.checked = (data.treasures || []).includes(el.value);
  });
  $('stageResult').textContent =
    '선택한 스테이지: ' + $('stage').value;
}

$('save').addEventListener('click', () => {
  localStorage.setItem('lilyNyankoCustomSettings',
    JSON.stringify(getSettings()));
  $('saveMessage').textContent = '✅ 설정을 저장했어!';
});

$('load').addEventListener('click', () => {
  const saved = localStorage.getItem('lilyNyankoCustomSettings');
  if (!saved) {
    $('saveMessage').textContent = '저장된 설정이 없어!';
    return;
  }
  try {
    setSettings(JSON.parse(saved));
    $('saveMessage').textContent = '✅ 설정을 불러왔어!';
  } catch {
    $('saveMessage').textContent = '설정을 읽을 수 없어.';
  }
});
</script>
</body>
</html>
