<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>릴리 냥코 커스텀</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171923;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:25px 10px}
h1{color:#b9a0ff;font-size:27px;margin:0 0 8px 0}
p.subtitle{color:#c4c6d4;font-size:14px;margin:0}
main{max-width:580px;margin:auto;padding:14px}
.panel{background:#262939;padding:20px;border-radius:17px;margin-bottom:16px}
textarea{width:100%;height:150px;background:#151722;color:white;border:1px solid #7662c4;border-radius:10px;padding:13px;font-size:14px;resize:vertical;font-family:monospace}
button{background:#8b6bff;color:white;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{width:100%;margin-top:14px}
.status{color:#baffce;white-space:pre-wrap;line-height:1.7;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>🐱 릴리 냥코 커스텀</h1>
  <p class="subtitle">나만의 냥코 설정을 만들어 보자!</p>
</header>

<main>
  <section class="panel">
    <h2>💻 냥코 커스텀 코드 입력</h2>
    <p style="font-size:13px;color:#c4c6d4;margin-bottom:12px;">아래 예시를 수정하거나 네 설정 코드를 붙여 넣어 줘.</p>
    
    <textarea id="myCode">{
  "name": "릴리 냥코",
  "coins": 10000,
  "exp": 5000,
  "attack": 2500,
  "health": 10000
}</textarea>
    
    <button class="primary" id="enter">✅ 코드 적용하기</button>
    <p id="codeMessage" class="status"></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

$('enter').addEventListener('click', () => {
  const code = $('myCode').value.trim();

  if (!code) {
    $('codeMessage').textContent = '냥코 코드를 입력해 주세요!';
    return;
  }

  // 로컬 스토리지 등에 저장하거나 적용하는 로직
  localStorage.setItem('lilyNyankoCode', code);
  $('codeMessage').textContent = '✅ 코드가 성공적으로 적용되었습니다!';
});
</script>
</body>
</html>
