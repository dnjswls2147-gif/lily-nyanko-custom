<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>릴리 냥코 커스텀</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #171923; color: white; font-family: Arial, sans-serif; }
  header { text-align: center; padding: 25px 10px; }
  h1 { color: #b9a0ff; font-size: 27px; margin: 0 0 8px 0; }
  p.subtitle { color: #c4c6d4; font-size: 14px; margin: 0; }
  main { max-width: 580px; margin: auto; padding: 14px; }
  
  .panel { background: #262939; padding: 20px; border-radius: 17px; margin-bottom: 16px; }
  
  label { display: block; margin-bottom: 8px; font-weight: bold; }
  input, select {
    width: 100%;
    background: #151722;
    color: white;
    border: 1px solid #7662c4;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    margin-bottom: 8px;
  }
  
  /* 버튼 스타일 */
  button {
    border: 0;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-bottom: 12px;
  }
  .btn-green { background: #28a745; color: white; }
  .btn-purple { background: #8b6bff; color: white; }
  
  /* 메시지 안내 */
  .msg-center { text-align: center; color: #ff8c8c; font-weight: bold; margin: 12px 0; min-height: 24px; }
  .status { color: #baffce; white-space: pre-wrap; line-height: 1.6; }
  .hidden { display: none; }
  
  /* 커스텀 항목 레이아웃 */
  .custom-item { margin-bottom: 15px; }
  .custom-item h3 { margin: 0 0 8px 0; font-size: 16px; color: #b9a0ff; }
</style>
</head>
<body>

<header>
  <h1>🐱 릴리 냥코 커스텀</h1>
  <p class="subtitle">나만의 냥코 설정을 만들어 보자!</p>
</header>

<main>
  <!-- 1. 코드 및 비밀번호 입력 네모 창 -->
  <section class="panel">
    <!-- 코드 입력 섹션 -->
    <label for="nyankoCode">냥코 코드 입력</label>
    <input id="nyankoCode" type="text" placeholder="코드를 입력해 주세요">
    <button class="btn-green" id="btnCodeInput">코드 입력하기</button>

    <!-- 비밀번호 입력 섹션 -->
    <label for="nyankoPw" style="margin-top: 15px;">비밀번호 입력</label>
    <input id="nyankoPw" type="password" placeholder="비밀번호를 입력해 주세요">
    <button class="btn-green" id="btnPwInput">비밀번호 입력하기</button>

    <!-- 안내 메시지 (가운데 정렬) -->
    <p id="alertMsg" class="msg-center"></p>

    <!-- 완료 버튼 -->
    <button class="btn-purple" id="btnComplete" style="margin-top: 10px;">완료</button>
  </section>

  <!-- 2. 완료 후 뜨는 새로운 네모 창 (기본 숨김) -->
  <section id="customPanel" class="panel hidden">
    <h2>🎮 냥코 커스텀 설정</h2>
    <p id="authStatus" class="status" style="margin-bottom: 20px;"></p>

    <!-- 1. 통조림 -->
    <div class="custom-item">
      <h3>1. 통조림</h3>
      <input id="cansInput" type="number" placeholder="통조림 개수 입력 (최대 45,000)">
      <p id="canWarning" class="msg-center" style="font-size: 13px; text-align: left; margin: 4px 0 0 0;"></p>
    </div>

    <!-- 2. 경험치 -->
    <div class="custom-item">
      <h3>2. 경험치</h3>
      <input id="xpInput" type="number" placeholder="경험치 입력">
    </div>

    <!-- 3. 스테이지 -->
    <div class="custom-item">
      <h3>3. 스테이지</h3>
      <select id="stageSelect">
        <option>세계편 1장</option>
        <option>세계편 2장</option>
        <option>세계편 3장</option>
        <option>미래편 1장</option>
        <option>미래편 2장</option>
        <option>미래편 3장</option>
        <option>우주편 1장</option>
        <option>우주편 2장</option>
        <option>우주편 3장</option>
        <option>ALL 스테이지</option>
      </select>
    </div>

    <!-- 4. 보물 -->
    <div class="custom-item">
      <h3>4. 보물</h3>
      <select id="treasureSelect">
        <option>선택 안 함</option>
        <option>ALL 최고 보물</option>
      </select>
    </div>

    <button class="btn-purple" id="btnApplyCustom" style="margin-top: 15px;">설정 적용하기</button>
    <p id="customResult" class="status"></p>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);

  let isCodeSaved = false;
  let isPwSaved = false;

  // 1. 코드 입력 버튼 동작
  $('btnCodeInput').addEventListener('click', () => {
    const code = $('nyankoCode').value.trim();
    if (code) {
      isCodeSaved = true;
      $('alertMsg').style.color = '#baffce';
      $('alertMsg').textContent = '코드가 입력되었습니다.';
    } else {
      isCodeSaved = false;
      $('alertMsg').style.color = '#ff8c8c';
      $('alertMsg').textContent = '코드를 써주세요';
    }
  });

  // 2. 비밀번호 입력 버튼 동작
  $('btnPwInput').addEventListener('click', () => {
    const pw = $('nyankoPw').value.trim();
    if (pw) {
      isPwSaved = true;
      $('alertMsg').style.color = '#baffce';
      $('alertMsg').textContent = '비밀번호가 입력되었습니다.';
    } else {
      isPwSaved = false;
      $('alertMsg').style.color = '#ff8c8c';
      $('alertMsg').textContent = '비밀번호를 입력해주세요';
    }
  });

  // 3. 완료 버튼 클릭 처리
  $('btnComplete').addEventListener('click', () => {
    const code = $('nyankoCode').value.trim();
    const pw = $('nyankoPw').value.trim();

    $('alertMsg').style.color = '#ff8c8c';

    // 코드만 쓰거나 누락된 경우
    if (code && !pw) {
      $('alertMsg').textContent = '비밀번호를 입력해주세요';
      return;
    }
    // 비밀번호만 쓰거나 누락된 경우
    if (!code && pw) {
      $('alertMsg').textContent = '코드를 써주세요';
      return;
    }
    // 둘 다 비어있는 경우
    if (!code && !pw) {
      $('alertMsg').textContent = '코드를 써주세요';
      return;
    }

    // 둘 다 작성되어 있을 때 검증 수행
    $('customPanel').classList.remove('hidden');
    
    // 예시: 코드나 비번이 'test'이거나 유효하지 않은 예시일 때 (필요 시 원하는 코드로 변경 가능)
    // 여기서는 코드가 '1234' 이고 비밀번호가 '1234'일 때만 존재하는 코드로 판정되게 설정되어 있습니다.
    if (code === "1234" && pw === "1234") {
      $('authStatus').style.color = '#baffce';
      $('authStatus').textContent = '✅ 완료 되었습니다.';
    } else {
      $('authStatus').style.color = '#ff8c8c';
      $('authStatus').textContent = '❌ 존재하지 않은 코드';
    }

    // 화면 이동
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  });

  // 4. 통조림 45000 제한 검사
  $('cansInput').addEventListener('input', () => {
    const cans = Number($('cansInput').value);
    if (cans > 45000) {
      $('canWarning').textContent = '통조림 제한 넘음 (최대 45,000)';
    } else {
      $('canWarning').textContent = '';
    }
  });

  // 5. 최종 커스텀 설정 적용
  $('btnApplyCustom').addEventListener('click', () => {
    const cans = Number($('cansInput').value);
    if (cans > 45000) {
      alert('통조림 수량이 제한(45,000)을 초과했습니다!');
      return;
    }
    $('customResult').textContent = '✅ 커스텀 설정이 정상적으로 요청되었습니다!';
  });
</script>

</body>
</html>
