<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>릴리 냥코 커스텀</title>
  <style>
    body {
      background-color: #1a1b26;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      color: #bb9af7;
      margin-bottom: 8px;
      font-size: 24px;
    }

    .subtitle {
      color: #a9b1d6;
      font-size: 15px;
      margin-bottom: 24px;
    }

    .card {
      background-color: #24283b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      text-align: left;
    }

    label {
      display: block;
      font-size: 13px;
      color: #c0caf5;
      margin-bottom: 6px;
      margin-top: 12px;
    }

    label:first-of-type {
      margin-top: 0;
    }

    textarea {
      width: 100%;
      height: 100px;
      background-color: #16161e;
      color: #7aa2f7;
      border: 1px solid #414868;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 14px;
      resize: none;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px;
      background-color: #16161e;
      color: #ffffff;
      border: 1px solid #414868;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background-color: #7aa2f7;
      color: #1a1b26;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #89ddff;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 1. 타이틀 -->
    <h1>🐱 릴리 냥코 커스텀</h1>

    <!-- 2. 안내 텍스트 -->
    <p class="subtitle">자신의 냥코코드를 써주세요</p>

    <!-- 입력 폼 구역 -->
    <div class="card">
      <!-- 3. 코드 입력하는 곳 -->
      <label for="catCode">냥코 코드</label>
      <textarea id="catCode" placeholder="여기에 냥코 코드를 입력하세요..."></textarea>

      <!-- 4. 비번 입력하는 곳 -->
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호를 입력하세요">

      <!-- 5. 입력 확인 버튼 -->
      <button onclick="checkInput()">입력 확인</button>
    </div>
  </div>

  <script>
    function checkInput() {
      const code = document.getElementById('catCode').value;
      const password = document.getElementById('password').value;

      if (!code.trim()) {
        alert('냥코 코드를 입력해 주세요!');
        return;
      }

      if (!password.trim()) {
        alert('비밀번호를 입력해 주세요!');
        return;
      }

      // 입력 성공 시 동작
      alert('확인되었습니다!');
    }
  </script>
</body>
</html>
